name: Hope
options:
  bundleIdPrefix: com.hope
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"

settings:
  SWIFT_VERSION: "5.9"
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "1.0.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Hope:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PharmaTask/App
      - path: PharmaTask/Features
      - path: PharmaTask/Shared
      - path: PharmaTask/Resources
    info:
      path: PharmaTask/Info.plist
    entitlements:
      path: PharmaTask/PharmaTask.entitlements
    dependencies:
      - target: HopeWidgets
      - target: HopeShare
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hope.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""

  HopeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PharmaTaskWidgets
      - path: PharmaTask/Shared
    info:
      path: PharmaTaskWidgets/Info.plist
    entitlements:
      path: PharmaTaskWidgets/PharmaTaskWidgets.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hope.app.widgets
      DEVELOPMENT_TEAM: ""

  HopeShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PharmaTaskShare
      - path: PharmaTask/Shared
    info:
      path: PharmaTaskShare/Info.plist
    entitlements:
      path: PharmaTaskShare/PharmaTaskShare.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hope.app.share
      DEVELOPMENT_TEAM: ""

  HopeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HopeTests
    dependencies:
      - target: Hope
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hope.app.tests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  Hope:
    build:
      targets:
        Hope: all
    test:
      targets:
        - HopeTests
