name: Build Hope iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Image macos-14 đã ngừng hỗ trợ; dùng bản Xcode ổn định mới nhất có trên máy chạy.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Hope.xcodeproj \
            -scheme Hope \
            -configuration Release \
            -archivePath build/Hope.xcarchive \
            -destination "generic/platform=iOS" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Report build errors
        if: failure()
        run: |
          # In các dòng lỗi thành chú thích của lần chạy để đọc được mà không cần mở log.
          grep -E "error:" build/xcodebuild.log | sed -E 's#^.*/work/[^/]*/[^/]*/##' | sort -u | head -n 10 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done || true

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Hope.xcarchive/Products/Applications/Hope.app Payload/
          zip -r Hope.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hope-iOS-IPA
          path: Hope.ipa
          retention-days: 14
