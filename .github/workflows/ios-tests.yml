name: Hope iOS Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # Image macos-14 đã ngừng hỗ trợ; dùng bản Xcode ổn định mới nhất có trên máy chạy.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Pick an iPhone Simulator
        id: sim
        run: |
          # Lấy UDID của iPhone đầu tiên có sẵn, không phụ thuộc tên máy cụ thể.
          UDID=$(xcrun simctl list devices available iPhone \
            | grep -E "iPhone" | head -n 1 \
            | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          if [ -z "$UDID" ]; then
            echo "Không tìm thấy iPhone Simulator nào" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Run HopeTests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Hope.xcodeproj \
            -scheme Hope \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/HopeTests.xcresult \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Report build errors
        if: failure()
        run: |
          # In các dòng lỗi thành chú thích của lần chạy để đọc được mà không cần mở log.
          grep -E "error:" build/xcodebuild.log | sed -E 's#^.*/work/[^/]*/[^/]*/##' | sort -u | head -n 10 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hope-Test-Results
          path: |
            build/HopeTests.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
